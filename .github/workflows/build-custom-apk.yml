name: Build & Release Custom RethinkDNS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Website Full Flavor (Phone + Offline Blocklists)
        run: ./gradlew assembleWebsiteFullDebug --stacktrace

      - name: Prepare APK Asset
        id: prep
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
          APK_PATH=$(find app/build/outputs/apk/websiteFull/debug/ -name "*.apk" | head -n 1)
          cp "$APK_PATH" "rethinkdns-custom.apk"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: RethinkDNS Custom Build ${{ steps.prep.outputs.tag }}
          draft: false
          prerelease: false
          files: rethinkdns-custom.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
